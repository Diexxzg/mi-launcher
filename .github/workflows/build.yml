name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # El wrapper de Gradle (8.9) baja Gradle solo; el chmod cubre el caso de subir los archivos sin permiso de ejecucion.
      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: launcher/app/build/outputs/apk/release/*.apk
